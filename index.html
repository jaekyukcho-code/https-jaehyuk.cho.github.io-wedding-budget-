<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=./배포용_모바일/index.html" />
  <title>결혼준비 비용 대시보드</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #f7efe9 0%, #efe0d8 100%);
      color: #241d1a;
    }
    .box {
      text-align: center;
      padding: 28px 22px;
      border-radius: 22px;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 18px 36px rgba(39, 28, 25, 0.08);
      border: 1px solid rgba(120, 95, 88, 0.08);
    }
    .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 8px; }
    .sub { font-size: 0.85rem; color: #765f59; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">결혼준비 비용 대시보드</div>
    <div class="sub">공개 페이지로 이동 중입니다.</div>
  </div>
</body>
</html>
